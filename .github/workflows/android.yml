# Baut die Android-App (android/) als installierbare APK.
# Bei Pull Requests: APK als Artefakt am Workflow-Lauf. Auf main: zusätzlich ein GitHub-Release
# android-vX.Y.Z mit der APK, sobald es für die Version in android/VERSION noch keins gibt.
# Das Release wird nie "latest", damit der Desktop-Installer weiter das neueste App-Paket findet.
name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Version bestimmen
        id: version
        run: |
          version="$(tr -d '[:space:]' < android/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=android-v$version" >> "$GITHUB_OUTPUT"
      - name: APK bauen
        run: |
          gradle -p android assembleDebug --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/phoniebox-android-${{ steps.version.outputs.version }}.apk"
          (cd dist && sha256sum *.apk > "phoniebox-android-${{ steps.version.outputs.version }}.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: phoniebox-android-${{ steps.version.outputs.version }}
          path: dist/
      - name: Release veröffentlichen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag gibt es schon, nichts zu tun."
            exit 0
          fi
          version="${{ steps.version.outputs.version }}"
          awk -v v="# $version" '$0 == v {found=1; next} found && /^#/ {exit} found {print}' android/CHANGELOG.md > dist/notes.md
          gh release create "$tag" dist/*.apk dist/*.apk.sha256 \
            --target "$GITHUB_SHA" --title "Phoniebox Android $version" --notes-file dist/notes.md --latest=false
