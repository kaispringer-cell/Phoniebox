server {
    listen 80;
    listen [::]:80;
    server_name phoniebox.local;
    if ($host != phoniebox.local) { return 444; }
    return 308 https://phoniebox.local$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name phoniebox.local;
    if ($host != phoniebox.local) { return 444; }
    ssl_certificate /etc/phoniebox/tls.crt;
    ssl_certificate_key /etc/phoniebox/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    # OAuth codes and card information must not enter access logs.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host phoniebox.local;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_read_timeout 60s;
    }
}
